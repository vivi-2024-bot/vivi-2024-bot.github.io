<h1>YouTube分析ツール（読み取りのみ）</h1>
<p>このアプリは、運営者が自分のYouTubeチャンネルの分析（流入元・視聴者の年齢と性別など）に使う個人用ツールです。</p>
<ul>
<li>使用するのは運営者本人だけです。一般の方への提供はしていません。</li>
<li>Googleに求める権限は、YouTubeとYouTubeアナリティクスの<strong>読み取り専用</strong>の2つだけです。動画やチャンネルの変更・投稿・削除はできません。</li>
<li>取得したデータは運営者のパソコンの中にだけ保存し、第三者に渡しません。</li>
</ul>
